name: Render wrangler.toml
description: |
  Patch every committed wrangler.toml with the live D1 IDs and the
  resolved api URL. Static per-fork vars (SERVICE_PREFIX, ISSUER_HOST,
  JWT_AUDIENCE, EMAIL_DOMAIN) are inherited from the workflow env, so
  callers only have to supply the values that come out of provision.

inputs:
  d1_identity_id:
    description: D1 UUID for citizenry-identity-db
    required: true
  d1_vault_id:
    description: D1 UUID for citizenry-vault-db
    required: true
  d1_email_id:
    description: D1 UUID for citizenry-email-db
    required: true
  api_base_url:
    description: URL that admin-api proxies to (workers.dev or custom domain)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Patch wrangler.toml files
      shell: bash
      env:
        D1_IDENTITY_ID: ${{ inputs.d1_identity_id }}
        D1_VAULT_ID: ${{ inputs.d1_vault_id }}
        D1_EMAIL_ID: ${{ inputs.d1_email_id }}
        API_BASE_URL: ${{ inputs.api_base_url }}
      run: node scripts/ci/render-wrangler.mjs
