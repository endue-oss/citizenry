name: Setup workspace
description: |
  pnpm, Node 24, frozen install (with cache). Callers must run
  actions/checkout@v4 first — local composite actions cannot be
  loaded until the workspace exists.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
