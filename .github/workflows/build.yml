name: Build

# Reusable build job. Produces:
#   - TypeSpec-generated types under packages/spec/build/*
#   - SvelteKit Pages bundles for admin-web, docs
#
# Page bundles are uploaded as a single `page-bundles` artifact so
# deploy-pages can fan out without rebuilding.

on:
  workflow_call:

jobs:
  build:
    name: Build pages and spec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build spec (TypeSpec → generated types)
        run: pnpm --filter @citizenry/spec run build

      - name: Build Pages bundles
        env:
          # Stamp admin-web with its current version so it can self-compare
          # against the latest stable GitHub release ("What's new" rail
          # icon). Defaults to apps/admin-web/package.json `version`; set
          # the APP_VERSION repo variable to stamp an explicit release.
          PUBLIC_APP_VERSION: ${{ vars.APP_VERSION }}
          # Canonical origin baked into the docs site (sitemap + canonical
          # URLs). Forks default to their own Pages URL; the canonical
          # instance sets the SITE_ORIGIN variable to https://citizenry.id.
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || format('https://{0}-docs.pages.dev', vars.SERVICE_PREFIX || 'citizenry') }}
        run: |
          pnpm --filter @citizenry/admin-web run build
          pnpm --filter @citizenry/docs      run build

      - name: Upload page bundles
        # SvelteKit's adapter-cloudflare emits `_worker.js` under
        # `.svelte-kit/cloudflare/` that references sibling `output/`
        # and `cloudflare-tmp/`, so the whole `.svelte-kit/` directory
        # has to ride along. `.svelte-kit/` is a dotfile, so we have
        # to opt into include-hidden-files explicitly.
        uses: actions/upload-artifact@v4
        with:
          name: page-bundles
          path: |
            apps/admin-web/.svelte-kit
            apps/docs/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
