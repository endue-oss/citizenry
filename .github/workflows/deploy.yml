name: Deploy to Cloudflare

# Runs on every push to main and on manual dispatch.
# Provisions Cloudflare resources (D1, Hyperdrive) idempotently, applies
# database migrations (vault → D1, identity → Postgres), then deploys
# three Workers and two Pages projects.
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN     scoped token: Workers Scripts, Pages, D1, Hyperdrive (Edit)
#   CLOUDFLARE_ACCOUNT_ID    Cloudflare account ID
#   IDENTITY_DATABASE_URL    postgresql://user:pass@host:5432/dbname (origin behind Hyperdrive)
#
# Optional GitHub secrets (auto-generated on first run if not provided;
# generated values persist only in Cloudflare):
#   ENROLLMENT_PEPPER
#   SERVICE_KEY
#   ADMIN_ALLOWLIST
#
# Optional GitHub variables (vars, not secrets) — control [vars] blocks in wrangler.toml:
#   ISSUER_HOST      e.g. "id.example.com" (default: keep wrangler.toml value)
#   JWT_AUDIENCE     e.g. "api.id.example.com,citizenry-id" (default: keep wrangler.toml value)
#
# See docs/deploy.md for a full walkthrough.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/workflows/ci.yml'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      IDENTITY_DATABASE_URL: ${{ secrets.IDENTITY_DATABASE_URL }}
      WRANGLER_SEND_METRICS: 'false'

    steps:
      - name: Verify required secrets
        run: |
          missing=()
          [[ -n "$CLOUDFLARE_API_TOKEN" ]]  || missing+=(CLOUDFLARE_API_TOKEN)
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [[ -n "$IDENTITY_DATABASE_URL" ]] || missing+=(IDENTITY_DATABASE_URL)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required secret(s): ${missing[*]}"
            echo "Set them at Settings → Secrets and variables → Actions. See docs/deploy.md."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build spec (TypeSpec → generated types)
        run: pnpm --filter @citizenry/spec run build

      - name: Provision Cloudflare resources (D1 + Hyperdrive)
        id: provision
        run: node scripts/ci/provision.mjs

      - name: Render wrangler.toml with real IDs
        env:
          D1_VAULT_ID: ${{ steps.provision.outputs.d1_vault_id }}
          HYPERDRIVE_IDENTITY_ID: ${{ steps.provision.outputs.hyperdrive_identity_id }}
          ISSUER_HOST: ${{ vars.ISSUER_HOST }}
          JWT_AUDIENCE: ${{ vars.JWT_AUDIENCE }}
        run: node scripts/ci/render-wrangler.mjs

      - name: Apply vault migrations (D1)
        working-directory: apps/api
        run: yes | pnpm exec wrangler d1 migrations apply citizenry-vault --remote

      - name: Apply identity migrations (Postgres)
        run: ./scripts/ci/migrate-identity.sh

      - name: Build SvelteKit apps
        run: |
          pnpm --filter @citizenry/web run build
          pnpm --filter @citizenry/admin-web run build

      - name: Deploy Workers (api, admin-api, mcp)
        run: |
          set -e
          for app in api admin-api mcp; do
            echo "::group::deploy $app"
            (cd "apps/$app" && pnpm exec wrangler deploy)
            echo "::endgroup::"
          done

      - name: Push Worker secrets
        env:
          ENROLLMENT_PEPPER: ${{ secrets.ENROLLMENT_PEPPER }}
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
          ADMIN_ALLOWLIST: ${{ secrets.ADMIN_ALLOWLIST }}
        run: ./scripts/ci/push-secrets.sh

      - name: Deploy Pages (web, admin-web)
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: ./scripts/ci/deploy-pages.sh

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "## ✓ Deployment complete"
            echo ""
            echo "| Service | Type | Default endpoint |"
            echo "|---|---|---|"
            echo "| citizenry-api       | Worker | \`citizenry-api.<your-subdomain>.workers.dev\` |"
            echo "| citizenry-admin-api | Worker | \`citizenry-admin-api.<your-subdomain>.workers.dev\` |"
            echo "| citizenry-mcp       | Worker | \`citizenry-mcp.<your-subdomain>.workers.dev\` |"
            echo "| citizenry-web       | Pages  | \`citizenry-web.pages.dev\` |"
            echo "| citizenry-admin-web | Pages  | \`citizenry-admin-web.pages.dev\` |"
            echo ""
            echo "Replace \`<your-subdomain>\` with your account's workers.dev subdomain"
            echo "(visible in the Cloudflare dashboard under Workers & Pages → Overview)."
          } >> "$GITHUB_STEP_SUMMARY"
