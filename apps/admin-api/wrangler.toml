name = "citizenry-admin-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 13001

# admin-api no longer accesses the DB directly.
# Every admin action is forwarded to api's /_admin/* routes via the service
# binding below, authenticated by SERVICE_KEY. The binding is required:
# workers.dev disallows Worker→Worker fetch by public URL (CF 1042).

[[services]]
binding = "API"
service = "citizenry-api"

[vars]
# Retained as a path/origin hint for local dev only. The service binding
# ignores the URL host in production, so only the path matters there.
API_BASE_URL = "http://127.0.0.1:13000"

# secrets — `wrangler secret put`
#   SERVICE_KEY        — the X-Service-Key admin-api sends must match api's expected value
