name = "citizenry-admin-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 13001

# admin-api no longer accesses the DB directly.
# Every admin action is HTTP-proxied to api's /_admin/* routes → authenticated by SERVICE_KEY.

[vars]
# api's base URL — production: the workers.dev subdomain or a custom domain.
# local dev: port 13000 served by api's `wrangler dev`.
API_BASE_URL = "http://127.0.0.1:13000"

# secrets — `wrangler secret put`
#   SERVICE_KEY        — the X-Service-Key admin-api sends must match api's expected value
