name = "citizenry-admin-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1

[dev]
port = 13001

# admin-api accesses identity D1 directly to rotate admin refresh
# tokens. It also reads the admin password from the config D1 (key
# `admin.password`) via packages/config's colo-local cached reader.
# Every other admin action is forwarded to api's /_admin/* routes via
# the service binding below (X-Service-Key PSK). The service binding
# is required because workers.dev disallows Worker→Worker fetch via
# the public URL (CF 1042).

[[services]]
binding = "API"
service = "citizenry-api"

# identity domain — D1. Holds the admin_refresh_token registry only.
# The admin password itself lives in the config DB.
[[d1_databases]]
binding = "DB_IDENTITY"
database_name = "citizenry-identity-db"
database_id = "local-dev-placeholder"
migrations_dir = "../../packages/identity/migrations"

# config domain — D1. Single source of truth for the admin password
# (key `admin.password`). Reads go through the colo-local TTL cache
# from `@citizenry/config`.
[[d1_databases]]
binding = "DB_CONFIG"
database_name = "citizenry-config-db"
database_id = "local-dev-placeholder"
migrations_dir = "../../packages/config/migrations"

[vars]
# Retained as a path/origin hint for local dev only. The service binding
# ignores the URL host in production, so only the path matters there.
API_BASE_URL = "http://127.0.0.1:13000"
# Default admin account id. Override via the GitHub variable ADMIN_ID
# if you want a different login name baked into the deploy.
ADMIN_ID = "admin"
# Access token TTL in seconds — JWT exp claim. Default 15 minutes.
ACCESS_TOKEN_TTL_SECS = "900"

# secrets — `wrangler secret put`
#   SERVICE_KEY              — X-Service-Key PSK shared with api
#   ADMIN_JWT_SECRET         — HS256 secret used to sign access tokens
#   ADMIN_REFRESH_PEPPER     — pepper folded into refresh-token hashes
