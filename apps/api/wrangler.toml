name = "citizenry-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1

[dev]
port = 13000

# identity domain — D1
[[d1_databases]]
binding = "DB_IDENTITY"
database_name = "citizenry-identity-db"
database_id = "local-dev-placeholder"
migrations_dir = "../../packages/identity/migrations"

# vault domain — D1
[[d1_databases]]
binding = "DB_VAULT"
database_name = "citizenry-vault-db"
database_id = "local-dev-placeholder"
migrations_dir = "../../packages/vault/migrations"

# config domain — D1. Runtime control plane: written through admin-api,
# read by data-plane code with a colo-local TTL cache.
[[d1_databases]]
binding = "DB_CONFIG"
database_name = "citizenry-config-db"
database_id = "local-dev-placeholder"
migrations_dir = "../../packages/config/migrations"

# Service binding — api → mail. Used by human verification (and future
# agent notifications) to dispatch outbound mail through
# citizenry-mail's `/_internal/notify` privileged route. Gated by the
# shared SERVICE_KEY PSK. See ADR-2026-0005.
[[services]]
binding = "MAIL_WORKER"
service = "citizenry-mail"

[vars]
JWT_AUDIENCE = "api.citizenry.id,citizenry-id"
ISSUER_HOST = "citizenry.id"

# secrets — `wrangler secret put`
#   ENROLLMENT_PEPPER
#   SERVICE_KEY        — shared PSK. Used both as X-Service-Key on /_admin/*
#                        (admin-api → api) and outbound to MAIL_WORKER's
#                        /_internal/notify route.
