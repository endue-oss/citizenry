name = "citizenry-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 13000

# identity domain — D1
[[d1_databases]]
binding = "DB_IDENTITY"
database_name = "citizenry-identity"
database_id = "local-dev-placeholder"
migrations_dir = "../../packages/identity/migrations"

# vault domain — D1
[[d1_databases]]
binding = "DB_VAULT"
database_name = "citizenry-vault"
database_id = "local-dev-placeholder"
migrations_dir = "../../packages/vault/migrations"

[vars]
JWT_AUDIENCE = "api.citizenry.id,citizenry-id"
ISSUER_HOST = "citizenry.id"

# secrets — `wrangler secret put`
#   ENROLLMENT_PEPPER
#   SERVICE_KEY        — X-Service-Key check for /_admin/* routes (admin-api uses this)
