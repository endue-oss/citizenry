name = "citizenry-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[dev]
port = 13000

# identity domain — D1
[[d1_databases]]
binding = "DB_IDENTITY"
database_name = "citizenry-identity-db"
database_id = "local-dev-placeholder"
migrations_dir = "../../packages/identity/migrations"

# vault domain — D1
[[d1_databases]]
binding = "DB_VAULT"
database_name = "citizenry-vault-db"
database_id = "local-dev-placeholder"
migrations_dir = "../../packages/vault/migrations"

# config domain — D1. Runtime control plane: written through admin-api,
# read by data-plane code with a colo-local TTL cache.
[[d1_databases]]
binding = "DB_CONFIG"
database_name = "citizenry-config-db"
database_id = "local-dev-placeholder"
migrations_dir = "../../packages/config/migrations"

[vars]
JWT_AUDIENCE = "api.citizenry.id,citizenry-id"
ISSUER_HOST = "citizenry.id"

# secrets — `wrangler secret put`
#   ENROLLMENT_PEPPER
#   SERVICE_KEY        — X-Service-Key check for /_admin/* routes (admin-api uses this)
