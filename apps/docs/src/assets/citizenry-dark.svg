<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" fill="none">
  <title>Moonlit Pearl White Logo Transparent</title>
  <desc>Transparent-background pearl white SVG logo for dark UI surfaces.</desc>
  <defs>
    <!-- Background aura -->
    <radialGradient id="bgAura" cx="50%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#1C255B" stop-opacity="0.55"/>
      <stop offset="42%" stop-color="#0A122D" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#05060A" stop-opacity="0"/>
    </radialGradient>

    <!-- Core pearl gradients -->
    <linearGradient id="gradStar" x1="396" y1="452" x2="858" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FCFFFF"/>
      <stop offset="58%" stop-color="#F7FCFF"/>
      <stop offset="80%" stop-color="#E8D0FF"/>
      <stop offset="100%" stop-color="#C6B5FF"/>
    </linearGradient>

    <radialGradient id="gradStarGlow" cx="50%" cy="50%" r="66%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="42%" stop-color="#DDFBFF" stop-opacity="0.56"/>
      <stop offset="76%" stop-color="#C6B5FF" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#FFDCF5" stop-opacity="0"/>
    </radialGradient>

    <!-- Orbit gradients: left is ice, right is lavender/pink pearl -->
    <linearGradient id="gradArcTL" x1="278" y1="510" x2="514" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="48%" stop-color="#DDFBFF"/>
      <stop offset="100%" stop-color="#B1F3FF"/>
    </linearGradient>

    <linearGradient id="gradArcTR" x1="740" y1="270" x2="978" y2="510" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="46%" stop-color="#F7FCFF"/>
      <stop offset="75%" stop-color="#E8D0FF"/>
      <stop offset="100%" stop-color="#FFDCF5"/>
    </linearGradient>

    <linearGradient id="gradArcBR" x1="745" y1="984" x2="978" y2="744" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCFFFF"/>
      <stop offset="42%" stop-color="#F7FCFF"/>
      <stop offset="72%" stop-color="#E8D0FF"/>
      <stop offset="100%" stop-color="#C6B5FF"/>
    </linearGradient>

    <linearGradient id="gradArcBL" x1="277" y1="744" x2="514" y2="984" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#EAF6FF"/>
      <stop offset="100%" stop-color="#B1F3FF"/>
    </linearGradient>

    <linearGradient id="gradArcRim" x1="226" y1="219" x2="1046" y2="1032" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="42%" stop-color="#F7FCFF" stop-opacity="0.82"/>
      <stop offset="70%" stop-color="#E8D0FF" stop-opacity="0.66"/>
      <stop offset="100%" stop-color="#B1F3FF" stop-opacity="0.72"/>
    </linearGradient>

    <!-- Pearl circle gradients -->
    <radialGradient id="gradCircleTop" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(627 230) rotate(45) scale(78)">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="54%" stop-color="#F7FCFF"/>
      <stop offset="100%" stop-color="#E8D0FF"/>
    </radialGradient>

    <radialGradient id="gradCircleLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(235 627) rotate(45) scale(80)">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="52%" stop-color="#DDFBFF"/>
      <stop offset="100%" stop-color="#B1F3FF"/>
    </radialGradient>

    <radialGradient id="gradCircleRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1020 627) rotate(45) scale(80)">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="54%" stop-color="#FFF3FF"/>
      <stop offset="100%" stop-color="#FFDCF5"/>
    </radialGradient>

    <radialGradient id="gradCircleBottom" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(627 1019) rotate(45) scale(80)">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="48%" stop-color="#F7FCFF"/>
      <stop offset="100%" stop-color="#C6B5FF"/>
    </radialGradient>

    <!-- Gloss and glows -->
    <linearGradient id="starGloss" x1="510" y1="410" x2="660" y2="725" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="44%" stop-color="#FFFFFF" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="orbitGloss" x1="308" y1="309" x2="894" y2="889" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.90"/>
      <stop offset="36%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="glowSoft" x="-65%" y="-65%" width="230%" height="230%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0.96 0 0 0 0.72  0 1.08 0 0 0.88  0 0 1.24 0 1  0 0 0 .72 0" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
      </feMerge>
    </filter>

    <filter id="glowArc" x="-65%" y="-65%" width="230%" height="230%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0.85 0 0 0 0.45  0 1.05 0 0 0.82  0 0 1.25 0 1  0 0 0 .74 0"/>
    </filter>

    <filter id="dropPearl" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1C255B" flood-opacity="0.55"/>
      <feDropShadow dx="-8" dy="-5" stdDeviation="11" flood-color="#B1F3FF" flood-opacity="0.28"/>
      <feDropShadow dx="8" dy="4" stdDeviation="10" flood-color="#E8D0FF" flood-opacity="0.22"/>
    </filter>

    <filter id="glossBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <filter id="microBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>

    <pattern id="microSparkles" width="92" height="92" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <circle cx="16" cy="24" r="1.5" fill="#FFFFFF" fill-opacity="0.34"/>
      <circle cx="41" cy="68" r="1.1" fill="#FFFFFF" fill-opacity="0.18"/>
      <circle cx="72" cy="31" r="1.7" fill="#DDFBFF" fill-opacity="0.36"/>
      <circle cx="59" cy="12" r="0.9" fill="#FFF3FF" fill-opacity="0.24"/>
      <circle cx="12" cy="75" r="1.0" fill="#FFFFFF" fill-opacity="0.16"/>
      <circle cx="80" cy="78" r="1.2" fill="#FFFFFF" fill-opacity="0.20"/>
    </pattern>

    <radialGradient id="sparkleGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="64%" stop-color="#F7FCFF" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#E8D0FF" stop-opacity="0"/>
    </radialGradient>

    <g id="spark4">
      <path d="M0,-11 C2.2,-2.4 2.2,-2.4 11,0 C2.2,2.4 2.2,2.4 0,11 C-2.2,2.4 -2.2,2.4 -11,0 C-2.2,-2.4 -2.2,-2.4 0,-11 Z" fill="url(#sparkleGrad)"/>
    </g>

    <clipPath id="clipStar">
      <path d="M 627 350
               C 644 350 646 442 666 494
               C 686 548 716 579 771 597
               C 819 613 884 614 884 627
               C 884 640 819 641 771 657
               C 716 675 686 706 666 760
               C 646 812 644 904 627 904
               C 610 904 608 812 588 760
               C 568 706 538 675 483 657
               C 435 641 370 640 370 627
               C 370 614 435 613 483 597
               C 538 579 568 548 588 494
               C 608 442 610 350 627 350 Z"/>
    </clipPath>
  </defs>


  <!-- Outer moonlit arc glows -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M 506.3 257.4 A 389 389 0 0 0 256.7 506.8" stroke="url(#gradArcTL)" stroke-width="84" opacity="0.34" filter="url(#glowArc)"/>
    <path d="M 747.7 257.4 A 389 389 0 0 1 997.3 506.8" stroke="url(#gradArcTR)" stroke-width="84" opacity="0.34" filter="url(#glowArc)"/>
    <path d="M 997.3 747.2 A 389 389 0 0 1 747.7 996.6" stroke="url(#gradArcBR)" stroke-width="84" opacity="0.34" filter="url(#glowArc)"/>
    <path d="M 256.7 747.2 A 389 389 0 0 0 506.3 996.6" stroke="url(#gradArcBL)" stroke-width="84" opacity="0.34" filter="url(#glowArc)"/>
  </g>

  <!-- Outer arc pearl rims -->
  <g stroke="url(#gradArcRim)" stroke-width="61" stroke-linecap="round" stroke-linejoin="round" opacity="0.86" filter="url(#dropPearl)">
    <path d="M 506.3 257.4 A 389 389 0 0 0 256.7 506.8"/>
    <path d="M 747.7 257.4 A 389 389 0 0 1 997.3 506.8"/>
    <path d="M 997.3 747.2 A 389 389 0 0 1 747.7 996.6"/>
    <path d="M 256.7 747.2 A 389 389 0 0 0 506.3 996.6"/>
  </g>

  <!-- Outer arc gradient cores -->
  <g stroke-width="43" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 506.3 257.4 A 389 389 0 0 0 256.7 506.8" stroke="url(#gradArcTL)"/>
    <path d="M 747.7 257.4 A 389 389 0 0 1 997.3 506.8" stroke="url(#gradArcTR)"/>
    <path d="M 997.3 747.2 A 389 389 0 0 1 747.7 996.6" stroke="url(#gradArcBR)"/>
    <path d="M 256.7 747.2 A 389 389 0 0 0 506.3 996.6" stroke="url(#gradArcBL)"/>
  </g>

  <!-- Subtle orbit gloss -->
  <g stroke="url(#orbitGloss)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.54" filter="url(#glossBlur)">
    <path d="M 494 270 A 389 389 0 0 0 281 480"/>
    <path d="M 760 270 A 389 389 0 0 1 965 480"/>
    <path d="M 281 774 A 389 389 0 0 0 494 984"/>
  </g>

  <!-- Circle glows -->
  <circle cx="627" cy="230" r="82" fill="url(#gradCircleTop)" opacity="0.48" filter="url(#glowSoft)"/>
  <circle cx="235" cy="627" r="84" fill="url(#gradCircleLeft)" opacity="0.48" filter="url(#glowSoft)"/>
  <circle cx="1020" cy="627" r="84" fill="url(#gradCircleRight)" opacity="0.48" filter="url(#glowSoft)"/>
  <circle cx="627" cy="1019" r="84" fill="url(#gradCircleBottom)" opacity="0.48" filter="url(#glowSoft)"/>

  <!-- Circles -->
  <g stroke="#FFFFFF" stroke-width="8" stroke-opacity="0.82" filter="url(#dropPearl)">
    <circle cx="627" cy="230" r="65" fill="url(#gradCircleTop)"/>
    <circle cx="235" cy="627" r="67" fill="url(#gradCircleLeft)"/>
    <circle cx="1020" cy="627" r="67" fill="url(#gradCircleRight)"/>
    <circle cx="627" cy="1019" r="67" fill="url(#gradCircleBottom)"/>
  </g>

  <!-- Tiny glints around pearl points -->
  <g opacity="0.86">
    <g transform="translate(678 164) scale(1.0)" filter="url(#microBlur)"><use href="#spark4"/></g>
    <g transform="translate(164 580) scale(0.8)" filter="url(#microBlur)"><use href="#spark4"/></g>
    <g transform="translate(1088 580) scale(0.9)" filter="url(#microBlur)"><use href="#spark4"/></g>
    <g transform="translate(678 1088) scale(0.8)" filter="url(#microBlur)"><use href="#spark4"/></g>
  </g>

  <!-- Central star glow -->
  <path d="M 627 350
           C 644 350 646 442 666 494
           C 686 548 716 579 771 597
           C 819 613 884 614 884 627
           C 884 640 819 641 771 657
           C 716 675 686 706 666 760
           C 646 812 644 904 627 904
           C 610 904 608 812 588 760
           C 568 706 538 675 483 657
           C 435 641 370 640 370 627
           C 370 614 435 613 483 597
           C 538 579 568 548 588 494
           C 608 442 610 350 627 350 Z"
        fill="url(#gradStarGlow)" opacity="0.62" filter="url(#glowSoft)"/>

  <!-- Central star -->
  <path d="M 627 350
           C 644 350 646 442 666 494
           C 686 548 716 579 771 597
           C 819 613 884 614 884 627
           C 884 640 819 641 771 657
           C 716 675 686 706 666 760
           C 646 812 644 904 627 904
           C 610 904 608 812 588 760
           C 568 706 538 675 483 657
           C 435 641 370 640 370 627
           C 370 614 435 613 483 597
           C 538 579 568 548 588 494
           C 608 442 610 350 627 350 Z"
        fill="url(#gradStar)" stroke="#FFFFFF" stroke-opacity="0.78" stroke-width="8" stroke-linejoin="round" filter="url(#dropPearl)"/>

  <!-- Star gloss and embedded sparkle texture -->
  <g clip-path="url(#clipStar)">
    <path d="M 511 428 C572 386 648 411 681 487 C626 511 591 564 576 650 C519 602 495 505 511 428 Z" fill="url(#starGloss)" opacity="0.76" filter="url(#glossBlur)"/>
    <ellipse cx="643" cy="589" rx="88" ry="138" fill="#FFFFFF" opacity="0.12" filter="url(#glowSoft)"/>
    <rect x="368" y="348" width="520" height="558" fill="url(#microSparkles)" opacity="0.30" filter="url(#microBlur)"/>
  </g>

  <!-- Foreground star glints -->
  <g opacity="0.92">
    <g transform="translate(718 486) scale(1.15)" filter="url(#microBlur)"><use href="#spark4"/></g>
    <g transform="translate(530 724) scale(0.78)" filter="url(#microBlur)"><use href="#spark4"/></g>
    <g transform="translate(768 700) scale(0.58)" filter="url(#microBlur)"><use href="#spark4"/></g>
  </g>
</svg>
