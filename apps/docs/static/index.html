<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Citizenry API Reference</title>
    <meta name="description" content="OpenAPI reference for the Endue Citizenry identity and vault APIs." />
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="./scalar.standalone.js"></script>
    <script>
      Scalar.createApiReference('#app', {
        theme: 'deepSpace',
        layout: 'modern',
        darkMode: true,
        hideClientButton: true,
        hideTestRequestButton: true,
        hideDownloadButton: true,
        sources: [
          { url: './identity-api.yaml', title: 'Identity', slug: 'identity', default: true },
          { url: './vault-api.yaml', title: 'Vault', slug: 'vault' },
          { url: './mail-api.yaml', title: 'Mail', slug: 'mail' }
        ],
        metaData: {
          title: 'Citizenry API Reference'
        },
        // Selectors track Scalar's internal markup and may need a touch-up
        // when @scalar/api-reference is bumped. The `a[href*="scalar.com"]`
        // rule is the safety net — if the brand link survives, this catches it.
        customCss: `
          .scalar-api-reference [data-testid="scalar-brand"],
          .scalar-api-reference .references-footer,
          .scalar-api-reference .scalar-api-client__footer,
          .scalar-api-reference a[href*="scalar.com"] { display: none !important; }
        `
      });
    </script>
  </body>
</html>
