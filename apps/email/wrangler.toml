name = "citizenry-email"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 13004

# identity — D1. The Worker reads agent_key rows to verify Bearer JWTs.
[[d1_databases]]
binding = "DB_IDENTITY"
database_name = "citizenry-identity-db"
database_id = "local-dev-placeholder"
migrations_dir = "../../packages/identity/migrations"

# email — D1. Email-domain storage.
[[d1_databases]]
binding = "DB_EMAIL"
database_name = "citizenry-email-db"
database_id = "local-dev-placeholder"
migrations_dir = "../../packages/email/migrations"

[vars]
# JWT audience(s) accepted by this Worker. Comma-separated.
JWT_AUDIENCE = "mail.citizenry.id,citizenry-email"
# Outbound default-From host. When a sender omits `from`, the address
# becomes `<account_id>@<EMAIL_DOMAIN>`.
EMAIL_DOMAIN = "citizenry.id"

# Outbound — Cloudflare Email Service (public beta, 2026-04-16).
# Highest-priority sender; when bound, supersedes RESEND_API_KEY. Requires
# EMAIL_DOMAIN to be hosted on Cloudflare DNS so CF auto-configures
# SPF/DKIM/DMARC. Optionally restrict envelope senders with
# `allowed_sender_addresses = ["noreply@citizenry.id"]`.
[[send_email]]
name = "EMAIL"

# secrets — `wrangler secret put`
#   RESEND_API_KEY   Optional fallback when the Cloudflare EMAIL binding is
#                    unavailable. If neither is configured, outbound is
#                    logged-only and rows land with deliveryStatus='queued'.
