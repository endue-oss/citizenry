name = "citizenry-mail"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[dev]
port = 13004

# identity — D1. The Worker reads agent_key rows to verify Bearer JWTs.
[[d1_databases]]
binding = "DB_IDENTITY"
database_name = "citizenry-identity-db"
database_id = "local-dev-placeholder"
migrations_dir = "../../packages/identity/migrations"

# mail — D1. Mail-domain storage.
[[d1_databases]]
binding = "DB_MAIL"
database_name = "citizenry-mail-db"
database_id = "local-dev-placeholder"
migrations_dir = "../../packages/mail/migrations"

# config — D1. Read-only here. Writes happen via api `/_admin/*`.
# Wrapped with packages/config's withTtlCache helper so each isolate
# only hits D1 on cold cache or after the TTL elapses.
[[d1_databases]]
binding = "DB_CONFIG"
database_name = "citizenry-config-db"
database_id = "local-dev-placeholder"
migrations_dir = "../../packages/config/migrations"

[vars]
# JWT audience(s) accepted by this Worker. Comma-separated.
JWT_AUDIENCE = "mail.citizenry.id,citizenry-mail"
# Outbound default-From host. When a sender omits `from`, the address
# becomes `<account_id>@<MAIL_DOMAIN>`.
MAIL_DOMAIN = "citizenry.id"

# Outbound — Cloudflare Email Service (public beta, 2026-04-16).
# Highest-priority sender; when bound, supersedes the config-backed
# providers below. Requires MAIL_DOMAIN to be hosted on Cloudflare DNS
# so CF auto-configures SPF/DKIM/DMARC. Optionally restrict envelope
# senders with `allowed_sender_addresses = ["noreply@citizenry.id"]`.
[[send_email]]
name = "MAIL"

# Outbound provider credentials live in the config D1, not in Worker
# secrets. Set them via admin api `PUT /api/v1/admin/config/:key`:
#
#   Resend (priority 2)
#     mail.outbound.resend.api_key
#
#   AWS SES (priority 3) — both access_key_id and secret_access_key
#                          required to activate the sender.
#     mail.outbound.aws_ses.access_key_id
#     mail.outbound.aws_ses.secret_access_key
#     mail.outbound.aws_ses.region          (optional, default us-east-1)
#     mail.outbound.aws_ses.session_token   (optional, STS temporary creds)
#
# When none are configured, outbound falls back to the log-only sender
# and rows land with deliveryStatus='queued'. Changes propagate after
# the 5-minute colo-local TTL elapses; no redeploy needed.
