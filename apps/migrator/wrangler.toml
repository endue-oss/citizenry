name = "citizenry-migrator"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[dev]
port = 13003

# identity domain — D1 (SQLite)
[[d1_databases]]
binding = "DB_IDENTITY"
database_name = "citizenry-identity-db"
database_id = "local-dev-placeholder"
migrations_dir = "../../packages/identity/migrations"

# vault domain — D1
[[d1_databases]]
binding = "DB_VAULT"
database_name = "citizenry-vault-db"
database_id = "local-dev-placeholder"
migrations_dir = "../../packages/vault/migrations"

# mail domain — D1
[[d1_databases]]
binding = "DB_MAIL"
database_name = "citizenry-mail-db"
database_id = "local-dev-placeholder"
migrations_dir = "../../packages/mail/migrations"

# secrets — `wrangler secret put`
#   MIGRATOR_TOKEN   Bearer token required on every request to /apply, /status
